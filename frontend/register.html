<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YubiLab — Register</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #0a0a0f; color: #e0e0e0;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .form-box { background: #1a1a2e; padding: 40px; border-radius: 16px; width: 100%;
                    max-width: 400px; border: 1px solid #333; }
        h1 { color: #e91e63; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #ccc; }
        .form-group input { width: 100%; padding: 12px 14px; background: #0a0a1a; border: 1px solid #333;
                           border-radius: 8px; color: white; font-size: 14px; }
        .form-group input:focus { border-color: #e91e63; outline: none; }
        .btn { width: 100%; padding: 14px; background: #e91e63; color: white; border: none;
               border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn:hover { background: #c2185b; }
        .link { text-align: center; margin-top: 16px; }
        .link a { color: #e91e63; text-decoration: none; }
        .alert { padding: 10px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .alert-error { background: #b71c1c; color: #ef9a9a; }
    </style>
</head>
<body>
    <div class="form-box">
        <h1>Register</h1>
        <div class="alert alert-error" id="error"></div>
        <form onsubmit="doRegister(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autofocus>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password (min 6 chars)</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn">Register</button>
        </form>
        <div class="link">
            <a href="/login">Already have an account? Login</a>
        </div>
    </div>

    <script>
    async function doRegister(e) {
        e.preventDefault();
        const errEl = document.getElementById('error');
        errEl.style.display = 'none';

        try {
            const resp = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await resp.json();
            if (resp.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/editor';
            } else {
                errEl.textContent = data.error || 'Registration failed';
                errEl.style.display = 'block';
            }
        } catch (err) {
            errEl.textContent = 'Network error';
            errEl.style.display = 'block';
        }
    }
    </script>
</body>
</html>
